[build-system]
requires = ["setuptools>=80.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fast-gpu-asr"
version = "0.1.0"
description = "Batched TensorRT inference for Zipformer and Parakeet ASR models."
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "SoundsGoodAI" }]
keywords = [
    "asr",
    "cuda",
    "gpu-inference",
    "parakeet",
    "speech-recognition",
    "tensorrt",
    "zipformer",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "audioop-lts>=0.2.2,<1.0.0 ; python_full_version >= '3.13'",
    "cuda-bindings>=13.3.1,<14.0.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cuda-pathfinder>=1.8.1,<2.0.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cuda-toolkit[cccl,cublas,cudart,cufft,nvcc]>=13.3.1,<14.0.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "cupy-cuda13x>=14.2.0,<15.0.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "numpy>=2.5.2,<3.0.0",
    "omegaconf>=2.3.1,<3.0.0",
    "onnx>=1.22.0,<2.0.0",
    "onnxscript>=0.7.1,<1.0.0",
    "sentencepiece>=0.2.2,<1.0.0",
    "tensorrt-cu13>=11.2.1.2,<12.0.0 ; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "torch>=2.14.0,<3.0.0",
]

[project.optional-dependencies]
benchmark = [
    "datasets>=5.0.1,<6.0.0",
    "kaldialign>=0.12.0,<1.0.0",
    "matplotlib>=3.11.1,<4.0.0",
    "num2words>=0.5.14,<1.0.0",
    "regex>=2026.9.3",
]
dev = [
    "clang-format>=23.1.0",
    "kaldi-native-fbank>=1.22.3,<2.0.0",
    "packaging>=26.3",
    "pyyaml>=6.0.3,<7.0.0",
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.6,<1.0.0",
]

[project.scripts]
fast-gpu-asr-export-parakeet = "fast_gpu_asr.export.export_parakeet:main"
fast-gpu-asr-export-zipformer = "fast_gpu_asr.export.export_zipformer:main"

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.urls]
Homepage = "https://github.com/SoundsGoodAI/fast-gpu-asr"
Issues = "https://github.com/SoundsGoodAI/fast-gpu-asr/issues"
Repository = "https://github.com/SoundsGoodAI/fast-gpu-asr.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fast_gpu_asr = ["py.typed"]
"fast_gpu_asr.tensorrt_plugins" = ["*.cu", "*.h", "*.so"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Embedded CUDA uses the 100-column check in decoder/lint_gpu_kernels.py.
"src/fast_gpu_asr/decoder/gpu_kernels.py" = ["E501"]

[tool.pytest.ini_options]
addopts = ["--strict-markers"]
pythonpath = ["."]
testpaths = ["tests"]
